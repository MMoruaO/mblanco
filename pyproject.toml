[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mblanco"
version = "0.1.0"
description = "Chat y archivos compartidos para proyectos locales"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12", "textual>=0.50"]

[project.scripts]
mblanco = "mblanco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
